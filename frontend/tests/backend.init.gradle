allprojects {
    layout.buildDirectory.set(file('build/frontend-verification'))
    afterEvaluate {
        sourceSets.test.java.srcDir('frontend/tests/backend')
        def isolated = [
            'spring.datasource.url': 'jdbc:h2:mem:frontend_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1',
            'spring.datasource.username': 'sa', 'spring.datasource.password': '',
            'spring.datasource.driver-class-name': 'org.h2.Driver',
            'spring.flyway.url': 'jdbc:h2:mem:frontend_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1',
            'spring.flyway.user': 'sa', 'spring.flyway.password': '',
            'debug': 'false', 'trace': 'false'
        ]
        tasks.withType(Test).configureEach { systemProperties isolated }
        tasks.register('frontendTestServer', JavaExec) {
            dependsOn testClasses
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'com.konkuk.memory.FrontendTestServer'
            systemProperties isolated
            systemProperty 'spring.profiles.active', 'test'
            systemProperty 'server.port', '18080'
            systemProperty 'server.address', '127.0.0.1'
            systemProperty 'app.cors.allowed-origins', 'http://localhost:5173'
            systemProperty 'app.jwt.secret', 'dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1taW5pbXVtLTEyMzQ1Njc4OTA='
        }
    }
}
