spring:
  datasource:
    url: jdbc:h2:mem:memorytest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
app:
  storage:
    mode: local
  jwt:
    # Public fixture used ONLY in tests. Never use this key for a running service.
    secret: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1taW5pbXVtLTEyMzQ1Njc4OTA=
    issuer: memory-recall-test
    ttl-seconds: 1800
  cors:
    allowed-origins: http://localhost:3000
